<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Rating</title>

<style>
  :root {
    --accent: #41D198;
    --accent-hover: #5FE0AC;
    --bg: #1C4250;
    --text: #FFFFFF;
    --btn-text: #1A2B33;
    --star-inactive: #2E5A68;
    --error: #FF8A80;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
  }

  .card {
    background: rgba(255,255,255,0.03);
    border: 1.5px solid #41D198;
    border-radius: 9px;

    /* 25% smaller */
    padding: 21px 27px;
    max-width: 315px;

    width: 100%;
    text-align: center;
    box-shadow: 0 0 9px rgba(65, 209, 152, 0.15);
    backdrop-filter: blur(4px);
  }

  .card h2 {
    color: #FFFFFF;

    /* 20px → 15px */
    font-size: 15px;

    margin: 0 0 15px 0;
    font-weight: 600;
  }

  .stars {
    display: flex;
    justify-content: center;

    /* 10px → 7.5px */
    gap: 7.5px;

    margin-bottom: 16.5px;
  }

  .star {
    /* 40px → 30px */
    font-size: 30px;

    line-height: 1;
    color: var(--star-inactive);
    cursor: pointer;
    transition: color 0.15s ease, transform 0.15s ease;
    user-select: none;
  }

  .star.active,
  .star.hover {
    color: var(--accent);
    transform: scale(1.08);
  }

    background: var(--accent);
    color: var(--btn-text);
    border: none;
