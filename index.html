<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Rating</title>
<style>
 :root {
  --accent: #41D198;
  --accent-hover: #5FE0AC;
  --text: #FFFFFF;
  --btn-text: #1A2B33;
  --star-inactive: #2E5A68;
  --error: #FF8A80;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.03);
  border: 2px solid var(--accent);
  border-radius: 16px;

  /* MUCH BIGGER */
  width: 100%;
  max-width: 600px;
  padding: 40px 50px;

  text-align: center;
  box-shadow: 0 0 12px rgba(65, 209, 152, 0.20);
  backdrop-filter: blur(4px);
}

.card h2 {
  color: var(--text);
  font-size: 26px;
  line-height: 1.35;
  margin: 0 0 28px 0;
  font-weight: 600;
}

.stars {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 30px;
}

.star {
  font-size: 52px;
  line-height: 1;
  color: var(--star-inactive);
  cursor: pointer;
  transition: color 0.15s ease, transform 0.15s ease;
  user-select: none;
}

.star.active,
.star.hover {
  color: var(--accent);
  transform: scale(1.08);
}

.submit-btn {
  background: var(--accent);
  color: var(--btn-text);
  border: none;
  border-radius: 9px;

  padding: 14px 30px;
  font-size: 20px;
  font-weight: 600;

  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
}

.submit-btn:hover {
  background: var(--accent-hover);
}

.submit-btn:active {
  transform: scale(0.97);
}

.submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.status {
  margin-top: 16px;
  font-size: 17px;
  color: var(--accent);
  min-height: 22px;
}

.status.error {
  color: var(--error);
}
